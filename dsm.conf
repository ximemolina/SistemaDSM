# dsm.conf : ejemplo para 5 nodos
# Los puertos TCP y UDP usan el rango 27800-27899.
page_size          = 4096
mem_per_node       = 16M          # 16 MiB por nodo (admite K/M/G)
max_nodes          = 5            # P1: debe coincidir con el numero de lineas node=
global_base_addr   = 0x700000000000
worker_pool_size   = 8
request_timeout_ms = 5000
barrier_timeout_ms = 60000
hash_seed          = 0
# node = <id> <ip> <puerto>
node = 0 127.0.0.1 27800
node = 1 127.0.0.1 27801
node = 2 127.0.0.1 27802
node = 3 127.0.0.1 27803
node = 4 127.0.0.1 27804
