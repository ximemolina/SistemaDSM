# dsm.conf : ejemplo para 2 nodos en la misma maquina (Prototipo 1)
# Cambiar los puertos por el rango asignado a la pareja.
page_size          = 4096
mem_per_node       = 16M          # 16 MiB por nodo (admite K/M/G)
max_nodes          = 2            # P1: debe coincidir con el numero de lineas node=
global_base_addr   = 0x700000000000
worker_pool_size   = 8
request_timeout_ms = 5000
barrier_timeout_ms = 60000
hash_seed          = 0
# node = <id> <ip> <puerto>
node = 0 127.0.0.1 9101
node = 1 127.0.0.1 9102
