# dsm.conf : ejemplo para 2 nodos en maquinas distintas
# Los puertos TCP y UDP usan el rango 27800-27899.
page_size          = 4096
mem_per_node       = 16M          # 16 MiB por nodo (admite K/M/G)
max_nodes          = 16            # P1: debe coincidir con el numero de lineas node=
global_base_addr   = 0x700000000000
worker_pool_size   = 8
request_timeout_ms = 5000
barrier_timeout_ms = 60000
heartbeat_port_offset = 10
hash_seed          = 0
# node = <id> <ip> <puerto>
node = 0 172.19.12.48 27800
node = 1 172.19.12.48 27801
node = 2 172.19.12.48 27802
node = 3 172.19.12.48 27803
node = 4 172.19.12.48 27804
node = 5 172.19.12.48 27805
node = 6 172.19.12.48 27806
node = 7 172.19.12.48 27807
node = 8 172.19.13.161 27800
node = 9 172.19.13.161 27801
node = 10 172.19.13.161 27802
node = 11 172.19.13.161 27803
node = 12 172.19.13.161 27804
node = 13 172.19.13.161 27805
node = 14 172.19.13.161 27806
node = 15 172.19.13.161 27807


