# Laboratorio: segunda app en paralelo (puertos 27810/27811, UDP +10)
# Edite las IPs para que coincidan con las asignadas en dsm.conf.
page_size          = 4096
mem_per_node       = 16M
max_nodes          = 2
global_base_addr   = 0x700000000000
worker_pool_size   = 8
request_timeout_ms = 5000
barrier_timeout_ms = 60000
heartbeat_port_offset = 10
hash_seed          = 0
node = 0 172.19.12.81 27810
node = 1 172.19.12.48 27811
